site_name: AutoLever pneumatic press drive
site_url: https://openreloading.github.io/AutoLever/
repo_url: https://github.com/OpenReloading/AutoLever
site_description: An air cylinder works the lever of a Lee APP press, controlled by four 24 V relays and a jam timer. Parts, wiring and tubing.
copyright: MIT licence

theme:
  name: material
  font: false   # system fonts: no requests to Google Fonts
  logo: assets/autolever.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}

# rebuild on data and macro changes too, not only docs/
watch:
  - data
  - main.py

plugins:
  - macros:
      module_name: main
      on_error_fail: true

extra_css:
  - assets/guide.css

markdown_extensions:
  - attr_list
  - md_in_html

nav:
  - Introduction: index.md
  - BOM: bom.md
  - Wiring: wiring.md
  - Tubing: tubing.md
