site_name: AutoLever   # short: the longer name is cut off in the header at 390 px
site_url: !ENV [SITE_URL, 'https://openreloading.github.io/AutoLever/']
site_description: An air cylinder works the lever of a Lee APP press, run by a 24 V StamPLC controller and two sensors. Parts, wiring and tubing.
repo_url: https://github.com/OpenReloading/AutoLever
repo_name: OpenReloading/AutoLever
# footer links (README: repository, Discord); the licence file is in the repository; MakerWorld follows with #23
copyright: >-
  <a href="https://github.com/OpenReloading/AutoLever">Repository</a>
  <a href="https://discord.gg/hUCSjDYNaa">Discord</a>
  <a href="https://github.com/OpenReloading/AutoLever/blob/main/LICENSE">MIT licence</a>

theme:
  name: material
  custom_dir: overrides   # partials/source.html: header facts rendered at build time
  font: false   # system fonts: no requests to Google Fonts
  logo: assets/autolever-white.svg   # white on the dark header, drawn black on the light one (extra.css)
  favicon: assets/favicon.svg
  features:
    - navigation.footer   # previous and next page links, no third-party request
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/extra.css

# header facts (latest tag, stars, forks): fetched from the GitHub API at build time, not in the browser
hooks:
  - hooks/repo_facts.py

# data/buildguide.json comes from main.py (python main.py)
plugins:
  - search   # Material's own search: index and worker are built into the site, no third-party request
  - buildguide:
      data: data/buildguide.json

markdown_extensions:
  - admonition
  - attr_list   # CSS classes on the home page buttons (its sections are styled by heading id)
  - md_in_html   # the two columns of "Change it" on the home page
  # the safety text is written once in snippets/ and included on the pages
  # sources: https://www.hse.gov.uk/work-equipment-machinery/maintenance.htm (safety guidance),
  # https://www.hse.gov.uk/electricity/withequip.htm (electrical competence),
  # https://www.gesetze-im-internet.de/bgb/__309.html (liability limits, German standard terms)
  - pymdownx.snippets:
      base_path: snippets
      check_paths: true

# agent docs in docs/ are not pages
exclude_docs: |
  agents/

nav:
  - Introduction: index.md
  - BOM: bom.md
  - Wiring: wiring.md
  - Tubing: tubing.md
  - Relay edition (deprecated prototype): relay.md
