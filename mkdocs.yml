site_name: AutoLever pneumatic press drive
site_url: https://openreloading.github.io/AutoLever/
site_description: An air cylinder works the lever of a Lee APP press, controlled by four 24 V relays and a jam timer. Parts, wiring and tubing.
copyright: MIT licence

theme:
  name: material
  font: false   # system fonts: no requests to Google Fonts
  logo: assets/autolever.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}

# data/buildguide.json comes from main.py (python main.py)
plugins:
  - buildguide:
      data: data/buildguide.json

# agent instruction files in docs/ are not pages
exclude_docs: |
  AGENTS.md
  CLAUDE.md
  agents/

nav:
  - Introduction: index.md
  - BOM: bom.md
  - Wiring: wiring.md
  - Tubing: tubing.md
