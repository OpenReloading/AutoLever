[env:stamplc]
build_src_filter = +<*>
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5StamPLC=https://github.com/m5stack/M5StamPLC#1.2.1
    M5Unified@0.2.28

; Bench image for the first power-up: live inputs and relay toggles (bench/bench.cpp)
[env:bench]
platform = ${env:stamplc.platform}
board = ${env:stamplc.board}
framework = ${env:stamplc.framework}
monitor_speed = ${env:stamplc.monitor_speed}
build_flags = ${env:stamplc.build_flags}
lib_deps = ${env:stamplc.lib_deps}
build_src_filter = -<*> +<../bench/>
