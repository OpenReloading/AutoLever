name: Lint Python

# ruff and basedpyright, installed from requirements-dev.txt so Dependabot bumps them. Rules are in pyproject.toml, the
# basedpyright baseline in .basedpyright/baseline.json, the ruff baseline as noqa comments.
on:
  pull_request:
  push:
    branches: [develop]

permissions: {}

jobs:
  lint-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # basedpyright needs the project's dependencies to resolve imports
      - run: 'pip install --only-binary :all: -r requirements-dev.txt'
      - run: ruff check .
      - run: basedpyright
