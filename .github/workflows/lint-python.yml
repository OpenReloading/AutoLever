name: Lint Python

# ruff and basedpyright (ESchuderer/repo-baseline). Rules are in pyproject.toml, the basedpyright baseline in
# .basedpyright/baseline.json, the ruff baseline as noqa comments.
on:
  pull_request:
  push:
    branches: [develop]

permissions: {}

jobs:
  lint-python:
    permissions:
      contents: read
    uses: ESchuderer/repo-baseline/.github/workflows/lint-python.yml@ffb474ae6c4b16adbdc70a603474df57937464f8 # main, after v0.1.0
    with:
      install-command: pip install -r requirements.txt
