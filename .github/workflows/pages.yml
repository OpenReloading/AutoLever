name: Deploy to GitHub Pages

# One workflow builds both editions into one artifact, because a Pages deployment replaces the whole site: the root is
# the latest release, built from its tag, and /next/ is main (site/, DOCS_BASE_URL sets its path). Until a stable release
# exists the root is main too, built a second time for the root path.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  # a deployment that has started is not cancelled; a newer push waits for it
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.latest.outputs.tag != '' }}
        with:
          ref: ${{ steps.latest.outputs.tag }}
          path: stable
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: next/site/.nvmrc
          # no npm cache: this job builds what is deployed (zizmor cache-poisoning)
          package-manager-cache: false
      # the navbar's repository facts come from the GitHub API at build time
      - name: Build main
        working-directory: next/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_BASE_URL: /${{ github.event.repository.name }}/next/
        run: |
          npm ci --ignore-scripts
          npm run build -- --out-dir ../dist
      # shortcut: releases up to v0.2.0 hold the MkDocs site; drop the mkdocs branch once the latest release has site/
      - name: Build latest release
        if: ${{ steps.latest.outputs.tag != '' }}
        working-directory: stable
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f site/package.json ]; then
            cd site && npm ci --ignore-scripts && npm run build -- --out-dir ../dist
          else
            python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
            .venv/bin/mkdocs build --strict -d dist
          fi
      # a Docusaurus build only works under its own base path, so main is built a second time for the root
      - name: Build main at the root
        if: ${{ steps.latest.outputs.tag == '' }}
        working-directory: next/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run build -- --out-dir ../root
      - name: Assemble site
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          mkdir -p _site/next
          cp -R next/dist/. _site/next/
          if [ -n "$TAG" ]; then
            cp -R stable/dist/. _site/
          else
            cp -R next/root/. _site/
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
