name: CI
on:
  push:
    branches: [develop]
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Skipped only on the promotion pull request (develop to main, same repository): the push to develop already checked it.
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
      # pytest and pytest-cov from the hash-locked requirements-dev.txt; the floor is fail_under in pyproject.toml
      - run: '.venv/bin/pip install --only-binary :all: --require-hashes -r requirements-dev.txt'
      # tests/test_cad.py renders cad/*.scad and skips itself without OpenSCAD
      # install steps are time-boxed (3 minutes per attempt, one retry): a stalled mirror must not run into the job timeout
      # the apt wrapper runs as root so that timeout can SIGKILL apt-get itself; an unprivileged timeout could only kill sudo
      - timeout-minutes: 7
        run: sudo .github/scripts/retry-once.sh 180 sh -c 'apt-get update && apt-get install -y --no-install-recommends openscad'
      - run: .venv/bin/pytest --cov
      # data/buildguide.json is committed: it must match data/*.yaml
      - run: .venv/bin/python main.py && git diff --exit-code data/buildguide.json
      - run: .venv/bin/mkdocs build --strict -d /tmp/www/AutoLever
      # the preview of the Pages workflow (mkdocs.develop.yml), next to the root as on the deployed site
      - run: .venv/bin/mkdocs build --strict -f mkdocs.develop.yml -d /tmp/www/AutoLever/develop
      - timeout-minutes: 7
        run: .github/scripts/retry-once.sh 180 .venv/bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server -d /tmp/www 8000 &
          .venv/bin/python tests/check_guide.py http://127.0.0.1:8000/AutoLever
          .venv/bin/python tests/check_guide.py http://127.0.0.1:8000/AutoLever/develop
  # ruff and basedpyright from the hash-locked requirements-dev.txt. Rules are in pyproject.toml, the basedpyright
  # baseline in .basedpyright/baseline.json, the ruff baseline as noqa comments.
  lint-python:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the version requirements-dev.txt was compiled with
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: '.venv/bin/pip install --only-binary :all: --require-hashes -r requirements-dev.txt'
      # basedpyright needs the project's dependencies to resolve imports; same install as the check job
      - run: .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/basedpyright --pythonpath .venv/bin/python
  workflows:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
  dependency-review:
    # also skipped on the promotion pull request, see `check`
    if: ${{ github.event_name == 'pull_request' && !(github.head_ref == 'develop' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
