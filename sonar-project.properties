sonar.organization=openreloading
sonar.projectKey=OpenReloading_AutoLever

# the Python code the unit tests cover, plus the site's config, scripts, components and stylesheets
sonar.sources=main.py,tools,site/docusaurus.config.ts,site/scripts,site/src
sonar.tests=tests
# written by: .venv/bin/pytest --cov --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
