sonar.organization=openreloading
sonar.projectKey=OpenReloading_AutoLever

# the Python code the unit tests cover, plus the theme overrides and stylesheets
sonar.sources=main.py,hooks,tools,overrides,docs/stylesheets
sonar.tests=tests
# written by: .venv/bin/pytest --cov --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
