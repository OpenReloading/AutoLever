[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "B", "C4", "C90", "SIM", "RET", "PTH", "PERF", "RUF", "UP", "I", "PT", "ARG",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLE", "PLW", "PLC",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 6
max-branches = 12
max-statements = 50

# Tests use fixtures and long setups, so size and complexity limits and unused-argument checks do not fit them.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "C901", "PLR0912", "PLR0913", "PLR0915", "PLC0415"]

[tool.basedpyright]
# "standard" is the type checker of Pyright. "recommended" adds the Unknown* and missing-annotation reports.
typeCheckingMode = "standard"
# Folders to check; the baseline lives in .basedpyright/baseline.json.
include = ["main.py", "hooks", "tests"]
# the tests import the MkDocs hook as a top-level module (pytest pythonpath below)
extraPaths = ["hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py is in the root, the MkDocs hook in hooks/
pythonpath = [".", "hooks"]

# Floor (percent) a little below the measured value, lines and branches together; raise it when coverage rises.
[tool.coverage.run]
# hooks/ has no __init__.py, so it is listed to count its files even when no test imports them
source_dirs = [".", "hooks"]
branch = true
# tests are not measured; the browser check runs against the built site in its own CI step; tools/ holds one-off generators
omit = ["tests/*", "tools/*", ".venv/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
# thin entry point: main.py writes the file, build() is what the tests cover
exclude_also = ["if __name__ == .__main__.:"]
