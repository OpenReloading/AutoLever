# Every wire of the pneumatic press control, StamPLC edition (24 V DC only, no mains in the box; the StamPLC runs
# the press: START/STOP and JOG are its front buttons, E-STOP cuts the valve supply). Single source of truth:
# the wiring page (interactive board + wire lists) and the build checks read this file.
# The relay edition (deprecated prototype) is in relay.yaml.
#
# parts: at = [x, y] on the board picture, size = [w, h], ports = terminals per side
#        (left/right/top/bottom, in drawing order). The picture is not to scale.
#        PLC ports: "+", "-", "C" and the inputs "1" to "8" on the top edge (as printed on the unit), the relays
#        "1NC", "1C", "1NO" to "4NO" on the bottom edge (C = common).
# steps: one build step each (the step notes are in guide.yaml); wire = [number, "PART:terminal", "PART:terminal", colour]
#        colours: red (+24 V, also the switched +24 V), black (Ground, 0 V) for the wires of the box, brown, blue and
#        black for a sensor's own wires, DIODE = a 1N4007 across two terminals (ring end first;
#        not counted as a wire under the screw)
#        Wire numbers and ends are what the saved ticks of a builder are keyed on: never renumber or swap an end.

# cable types. Every wire gets one in main.py: sensor (B0/B1 own cable), valve (to Y1/Y2),
# field (to QPM11), core (everything inside the box)
cables:
  core:   {name: "Stranded wire, red or black", size: "0.5 mm²", awg: "AWG 20"}
  field:  {name: "2-core cable, black sheath", size: "0.5 mm²", awg: "AWG 20"}
  valve:  {name: "2-core cable, black sheath", size: "0.5 mm²", awg: "AWG 20"}
  sensor: {name: "The sensor's own cable", size: "as supplied", awg: ""}
  diode:  {name: "Diode 1N4007, no wire", size: "", awg: ""}

# areas: a dashed frame with its title. One box; every cable that leaves it uses the one oval exit.
areas:
  box:     {title: "Control box", at: [20, 270], size: [1320, 580], color: "#334155"}
  air:     {title: "Air row", at: [330, 10], size: [600, 230], color: "#0f766e"}
  machine: {title: "Cylinder", at: [950, 10], size: [390, 230], color: "#475569"}

button: &button {top: ["1", "2"]}      # E-STOP: the closed contact (marked 11, 12 on the block)
wago5: &wago5 {top: ["1", "2", "3", "4", "5"]}
wago3: &wago3 {top: ["1", "2", "3"]}
sensor: &sensor {bottom: ["BN", "BU", "BK"]}
plug: &plug {left: ["1", "2"]}

parts:
  J1: {name: "J1 · 24 V in", kind: box, at: [45, 330], size: [80, 100], ports: {bottom: ["+", "-"]}}
  F1: {name: "F1 · fuse", kind: box, at: [150, 330], size: [70, 100], ports: {bottom: ["1", "2"]}}
  Q1: {name: "", sub: POWER, kind: button, color: "#3b82f6", at: [150, 520], size: [68, 48], ports: {top: ["IN", "OUT", "GND"]}}
  S3: {name: "", sub: E-STOP, kind: button, color: "#dc2626", at: [60, 720], size: [48, 48], ports: *button}
  X-24:  {name: "", sub: "X-24 · +24 V", kind: wago, at: [330, 330], size: [122, 30], ports: *wago5}
  X-0V1: {name: "", sub: "X-0V1 · Ground", kind: wago, at: [480, 330], size: [122, 30], ports: *wago5}
  X-0V2: {name: "", sub: "X-0V2 · Ground", kind: wago, at: [630, 330], size: [122, 30], ports: *wago5}
  X-S:   {name: "", sub: "X-S · E-STOP", kind: wago, at: [800, 330], size: [78, 30], ports: *wago3}
  X-V:   {name: "", sub: "X-V · valves", kind: wago, at: [900, 330], size: [78, 30], ports: *wago3}
  PLC: {name: "StamPLC", sub: "front face, as printed", kind: box, at: [330, 520], size: [700, 120],
        ports: {top: ["+", "-", "C", "1", "2", "3", "4", "5", "6", "7", "8"],
                bottom: ["1NC", "1C", "1NO", "2NC", "2C", "2NO", "3NC", "3C", "3NO", "4NC", "4C", "4NO"]}}
  QPM11: {name: "QPM11 pressure switch", kind: box, at: [770, 95], size: [140, 90], ports: {bottom: ["1", "2"]}}
  Y1: {name: "Y1 · extend", kind: plug, at: [1150, 400], size: [140, 70], ports: *plug}
  Y2: {name: "Y2 · retract", kind: plug, at: [1150, 540], size: [140, 70], ports: *plug}
  B0: {name: "B0 · home sensor", kind: sensor, at: [1000, 150], size: [72, 34], ports: *sensor}
  B1: {name: "B1 · front sensor", kind: sensor, at: [1220, 150], size: [72, 34], ports: *sensor}

# drawn for orientation only, wires route around them
props:
  - {name: "24 V power supply plugs into J1 (outside)", at: [40, 200], size: [250, 30]}
  - {name: "5/3 valve", at: [475, 125], size: [140, 50]}
  - {name: "cylinder → press lever", at: [975, 45], size: [340, 40]}

steps:
  - id: A
    title: "Connect power in and Ground"
    wires:
      - ["1", "J1:+", "F1:1", red]
      - ["2", "F1:2", "Q1:IN", red]
      - ["3", "J1:-", "X-0V1:1", black]
      - ["4", "Q1:GND", "X-0V1:2", black]
      - ["5", "X-0V1:5", "X-0V2:1", black]
  - id: B
    title: "Connect the StamPLC"
    wires:
      - ["6", "Q1:OUT", "X-24:1", red]
      - ["7", "X-24:2", "PLC:+", red]
      - ["8", "PLC:-", "X-0V1:3", black]
      - ["9", "PLC:C", "X-0V2:5", black]
  - id: C
    title: "Connect E-STOP and the pressure switch"
    wires:
      - ["10", "X-24:5", "S3:1", red]
      - ["11", "S3:2", "X-S:1", red]
      - ["12", "X-S:2", "QPM11:1", red]
      - ["13", "QPM11:2", "X-V:1", red]
      - ["14", "X-S:3", "PLC:3", red]
      - ["15", "X-V:2", "PLC:4", red]
  - id: D
    title: "Connect the end sensors"
    wires:
      - ["16", "B0:BN", "X-24:3", brown]
      - ["17", "B0:BU", "X-0V1:4", blue]
      - ["18", "B0:BK", "PLC:1", black]
      - ["19", "B1:BN", "X-24:4", brown]
      - ["20", "B1:BU", "X-0V2:2", blue]
      - ["21", "B1:BK", "PLC:2", black]
  - id: E
    title: "Connect the valve coils"
    wires:
      - ["22", "X-V:3", "PLC:1C", red]
      - ["23", "PLC:1NC", "PLC:2C", red]
      - ["24", "PLC:1NO", "Y1:1", red]
      - ["25", "PLC:2NO", "Y2:1", red]
      - ["26", "Y1:2", "X-0V2:3", black]
      - ["27", "Y2:2", "X-0V2:4", black]
      - ["D7", "Y1:1", "Y1:2", DIODE]
      - ["D8", "Y2:1", "Y2:2", DIODE]
