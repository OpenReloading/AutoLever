# The introduction page, short (user, 2026-10-05): what it is, features, use, needs, printing, build.
# A list item is text or [bold lead, text]; a section has list, steps (numbered) or text.
# Lead and section text can be a string or a list of paragraphs.
# warning: shown at the top of every page; plain language, with supply voltages stated explicitly.
# Safety guidance: https://www.hse.gov.uk/work-equipment-machinery/maintenance.htm
