# Guide content: wiring notes, tubing steps and BOM. Wire endpoints live in wiring.yaml and relay.yaml. The introduction is docs/index.md, the safety text snippets/.
wiring_notes:
  # one entry per wiring step id: do = the instruction, text = the details. main.py adds the connector line of each part
  # and the twin ferrule sentence from wiring.yaml between the two.
  A:
    do: Mount the rail, the StamPLC and the Wago connectors, then connect power in and Ground.
    text: >-
      Press an M3 heat-set insert into each of the two rail pads in the base (soldering iron, straight down, flush with the
      pad) and screw the rail on from above with an M3×6 pan-head screw and a washer. Clip the StamPLC on the rail, front
      towards the lid. Clip the Wagos into the rack on the front wall, wire entries up, levers towards the unit, left to
      right: X-24, X-0V1, X-0V2, X-S, X-V. Put a ferrule on every wire end that goes under a screw. Pass each cable that
      leaves the box through the oval exit before you strip it. Unplug the supply and disconnect the air. J1: wire 1 on the
      centre-pin lug (+); with three lugs, wire 3 on the one that stays connected to the sleeve with the plug in (meter).
      Solder lugs: solder and heat-shrink. F1 is the panel fuse holder next to the jack, flat tabs with insulated receptacles; the fuse goes in last. Wire 5 joins the two
      Ground Wagos. Every slot of a Wago is connected to all the others: use one wire per slot. Check with a meter: the
      centre pin of the plug is +24 V.
  B:
    do: Connect the power button Q1 to the +24 V Wago X-24, then the StamPLC to X-24 and to Ground.
    text: >-
      Q1 is the lit POWER rocker. IN and OUT are the two connectors that connect when it is switched on, GND is the third
      (wire 6 on GND shorts the supply). Flat tabs: insulated receptacles. Wire 4 gives the Q1 lamp its Ground. Terminal C
      of the StamPLC is the common of all eight inputs: it goes to Ground (wire 9), which suits PNP sensors. Check: POWER
      off, the Q1 lamp stays dark (lit: swap wires 2 and 6). Then insert the fuse, POWER on: the StamPLC starts and shows
      its screen. POWER off.
  C:
    do: Connect X-24 through the E-STOP and the pressure switch to the valve rail, and report both rails to the StamPLC.
    text: >-
      The valve rail X-V is live only while POWER is on, E-STOP is released and the air pressure is below the trip. E-STOP
      uses its closed contact: terminals 1 and 2, marked 11 and 12 on the contact block. Pressure switch QPM11: both cores
      of its cable are on the +24 V side (red) and it has no polarity; with no air, a meter must beep across its two
      terminals (closed contact type). The StamPLC inputs 3 and 4 only read the two rails: input 3 on shows E-STOP
      released, input 4 on shows the pressure is fine. An input accepts either polarity, it only needs the voltage between
      the input and C. E-STOP and the pressure switch cut only the valve rail: the StamPLC stays powered and shows the fault. Check: POWER
      on, air off: inputs 3 and 4 on; press E-STOP: both off.
  D:
    do: Connect the two end sensors.
    text: >-
      Keep each sensor's own wire colours: brown wire = +24 V from X-24, blue wire = Ground, black wire = signal. These are
      PNP sensors: check the label SMT-8M-A-PS-… (PS = PNP). B0 reports home on input 1, B1 reports front on input 2. The
      signal wire drives the StamPLC input directly. If an input reads on with its sensor off (leakage current of the
      sensor), add a 4.7 kΩ resistor from that input to C. Position: B0 so input 1 is on with the rod fully home, B1 so
      input 2 is on 2–3 mm before the press bottoms.
  E:
    do: Connect the two valve coils through their plugs and relays 1 and 2 of the StamPLC.
    text: >-
      Y1 extends; Y2 retracts. Pin 1 is +24 V (red): mark that core at both ends of each valve cable. Relay terminals are
      NC, COM and NO: follow the labels on the unit, they are not in the order of this drawing. Relay 1 COM comes from the
      valve rail X-V, relay 1 NC feeds relay 2 COM, so relay 1 and 2 can never switch the two coils on together. Inside each
      plug, fit D7/D8 with the cores: ring on pin 1 (+), plain leg on pin 2; reversed, they short the supply. Leave them out
      only if the plug's datasheet shows built-in suppression (an LED alone is not enough). The plugs fit either coil: with
      air on, press the red manual button next to each coil; the coil that drives the rod out gets plug Y1. Check without
      air, meter on the plug pins, with the bench program (firmware/bench) toggling the relays: both off, neither plug is
      live; relay 1 on, only Y1 is live; relay 2 on, only Y2 is live; both on, only Y1 is live.
relay_notes:
  # the relay edition (deprecated prototype): same layout as wiring_notes, steps in relay.yaml
  A:
    do: Mount the rail, the relay sockets and the Wago connectors, then fit a diode on each relay socket.
    text: >-
      Press an M3 heat-set insert into each of the three rail pads in the base (soldering iron, straight down, flush with
      the pad), then screw the rail on from above with an M3×6 pan-head screw and a washer, through the slots 37.5, 137.5 and
      187.5 mm from the K1 end of the rail. Clip the sockets on the rail with their 1/4 end towards the back wall, so the busy
      13/14 end faces the console. Clip the Wagos into the rack on the back wall, wire entries up, levers towards the relays:
      X-EN, X-M1, X-M2, X-D. Diodes D1–D4: ring to 14, plain leg to 13; crimp each leg into a 0.5 mm² ferrule. Put a ferrule
      on every wire end that goes under a screw. Pass each cable that leaves the box through its gland before you strip it.
  B:
    do: Connect the power jack J1 to the fuse F1 (red) and J1 to Ground (black), then take Ground to both Ground blocks and to
      the coil of every relay.
    text: >-
      Unplug the supply and disconnect the air. J1: wire 1 on the centre-pin lug (+); with three lugs, wire 4 on the one that
      stays connected to the sleeve with the plug in (meter). Solder lugs: solder and heat-shrink; flat tabs: insulated
      receptacles. On terminal 13 of each relay the diode leg from step A goes on the other side of the screw, in its own
      ferrule. Every slot of a Wago is connected to all the others: use one wire per slot. Check with a meter: the centre pin
      of the plug is +24 V.
  C:
    do: Connect the relays to each other.
    text: >-
      Use the numbers printed on the relay socket, not the position in the drawing. K2 starts the return at the front; K3
      holds itself until K4 cuts it at home. The extend coil Y1 is fed through K3 terminals 12 and 4 and K2 terminals 9 and 1
      (both closed at rest; Y1 itself follows in step F). Wire 16 brings the switched +24 V from X-EN to K1.
  D:
    do: Connect the fuse F1 to the power button Q1 (the blue one on the board), then the power button to E-STOP and to Ground.
    text: >-
      Q1 is the lit POWER button. IN and OUT are the two connectors that connect when it is switched on, GND is the third (wire
      3 on GND shorts the supply). Flat tabs: insulated receptacles. E-STOP uses its closed contact: terminals 1 and 2, marked
      11 and 12 on the contact block. E-STOP and the pressure switch feed X-EN directly, so E-STOP cuts all control power. Wire
      15 gives the Q1 lamp its Ground. Check: POWER off, the Q1 lamp stays dark (lit: swap wires 2 and 3). Then each relay: plug
      it in, POWER on, test lead from E-STOP terminal 1 to its terminal 14: it clicks and its LED lights. POWER off, relays out
      again until the wiring is done.
  E:
    do: Connect STOP, START and JOG to the relays and the timer.
    text: >-
      STOP uses its closed contact: terminals 1 and 2, marked 11 and 12 on the contact block. START and JOG use their open
      contact: terminals 3 and 4, marked 23 and 24. If your block is marked 21 and 22 or 13 and 14, go by the contact type.
      A meter beeps across a closed contact until the button is pressed and across an open contact only while it is pressed.
      Wire 10 takes the timer contact (T1 pins 8 and 5) to STOP: that contact, STOP and START with the K1 holding contact form
      the AUTO latch. Wire 20 feeds JOG from START's input, after STOP and the timer contact, so STOP and a jam stop JOG too.
      K1 (AUTO, wire 22) and JOG feed the same point, so the press runs while K1 is on or while JOG is held. After power-on
      and after STOP, E-STOP, a jam or an air pressure fault, K1 is off and the press moves only while you hold JOG; START
      resumes automatic mode. The K1 LED shows it.
  F:
    do: Connect the two valve coils through their plugs, and the timer diodes D5 and D6 to the same relay terminals.
    text: >-
      Y1 extends; Y2 retracts. Pin 1 is +24 V (red): mark that core at both ends of each valve cable. Inside each plug, fit
      D7/D8 with the cores: ring on pin 1 (+), plain leg on pin 2; reversed, they short the supply. Leave them out only if
      the plug's datasheet shows built-in suppression (an LED alone is not enough). D5's plain leg joins wire 37 in one 2-way
      Wago (221-412), D6's joins wire 38 in another (never 37 with 38: that ties Y1 to Y2); sleeve the bare legs with
      heat-shrink. The plugs fit either coil: with air on, press the red manual button next to each coil; the coil that drives
      the rod out gets plug Y1. K3 interlocks the coils: they can never be on together.
  G:
    do: Connect the jam timer T1 (the 8-pin timer) and the diode legs that feed it.
    text: >-
      Jam timer T1 ends automatic mode when a stroke takes too long. The numbers 1 to 8 are the pin numbers printed on the
      timer base. The timer must run on 24 V DC (+24 V on pin 7, Ground on pin 2), start counting when it gets power, restart
      from zero while its reset input (pins 1 and 3) is closed, and have one changeover contact (this build uses pins 8 and
      5). T1 runs only while a valve coil is on and the rod is away from home: K4 closes the reset at home and holds the time
      at zero. Bend each ring leg of D5 and D6 straight into its X-D slot, no wire. Set the wheels with no coil on (the timer
      reads them at power-up): left wheel (T1, relay off) about twice one out-and-back, 30 s until you have timed it; right
      wheel (T2, relay on) 1 s, never 0. Test without air: rod a few cm off home, press START: after T1 the timer clicks and
      K1 drops. A jam stops JOG too; let go before you try again. If your timer is different: match the supply (24 V DC), a
      reset input and one changeover contact, and map the pins of your base onto the pins named here. A contact block (marks
      like 11 and 12, or 23 and 24, as behind the buttons) is not a timer and cannot replace it.
  H:
    do: Connect E-STOP to the pressure switch and on to X-EN, then the two end sensors.
    text: >-
      X-EN is the control +24 V: live while POWER is on, E-STOP is released and the air pressure is below the trip. Pressure
      switch QPM11: both cores of its cable are on the +24 V side (red) and it has no polarity; with no air, a meter must beep
      across its two terminals (closed contact type). Keep each sensor's own wire
      colours: brown wire = +24 V from X-EN, blue wire = Ground, black wire = signal. These are PNP sensors: check the label
      SMT-8M-A-PS-… (PS = PNP). B1 drives K2 (front); B0 drives K4 (home). The signal wire (max 100 mA) drives the relay coil
      (37 mA) directly. Position: B0 so K4 lights with the rod fully home, B1 so K2 lights 2–3 mm before the press bottoms.
tubes:
- id: air1
  title: Supply → filter-regulator
  from: Air supply (hose coupler)
  to: FRL · IN
  text: 'Mount the FRL upright on its bracket at the board edge, bowls hanging vertically and drains pointing down off the
    board, away from the control box. Follow the arrow on the FRL body. Supply: 7–10 bar; start with the regulator at 2 bar.
    If the unit has a lubricator, leave it empty: the cylinder and the valve are greased for life, and once you oil them you
    have to keep oiling.'
  check: Hose retained; FRL flow arrow points towards the valve.
- id: shutoff
  title: Filter-regulator → shut-off
  from: FRL · OUT
  to: Shut-off · IN
  text: 'Fit the 3/2 shut-off with exhaust right after the FRL, its arrow pointing away from the FRL. Closed, it cuts the supply
    and vents everything after it: tee, pressure switch, valve and cylinder. Close it whenever you reach into the press.'
  check: Arrow points away from the FRL; exhaust port open, not plugged.
- id: air2
  title: Shut-off → pressure-switch tee
  from: Shut-off · OUT
  to: Tee · inlet
  text: 'Connect the shut-off outlet to the 6 mm tee. The QPM11 sits on the tee''s branch and measures the regulated supply
    pressure. Set it to open at 6 bar: regulator at 6 bar (only for this setting), POWER on, rod pushed home by hand
    so the K4 LED lights, turn its screw until K4 goes out; then back to 5.5 bar or less.'
  check: Pressure switch after the shut-off; tee branch sealed.
- id: air3
  title: Tee → valve supply
  from: Tee · outlet
  to: Valve · P
  text: 'Connect the tee to P, the supply port. Read the letters on the valve body: never connect the supply to R or S (the
    exhausts).'
  check: Tube reaches P; no tight bend or kink.
- id: air4
  title: Valve A → cylinder cap end
  from: Valve · A
  to: Cylinder · cap-end flow control
  text: 'Connect A to the end without the rod. Fit a meter-out flow control: free flow into the cylinder, restricted flow
    out. This cap-end adjuster controls retraction speed. Start with both flow controls 1 turn open.'
  check: A reaches the cap end; flow-control direction confirmed.
- id: air5
  title: Valve B → cylinder rod end
  from: Valve · B
  to: Cylinder · rod-end flow control
  text: Connect B to the port beside the rod. Again use meter-out orientation. This rod-end adjuster controls extension speed.
    Leave room for cylinder movement.
  check: B reaches the rod end; tube cannot rub or pull tight.
- id: air6
  title: Fit both exhaust silencers
  from: Valve · R + S
  to: Atmosphere · two silencers
  text: 'Fit one silencer to each exhaust and point both away from the control box and the operator. Do not cap or join these
    ports to supply. First air-on, POWER off: nothing may move and the lever must stay free by hand. If the rod creeps out,
    the valve is not exhaust-centre: close the shut-off.'
  check: Both exhausts open through silencers; no obstruction.
